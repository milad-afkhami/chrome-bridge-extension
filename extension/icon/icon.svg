  <path d="M20 94 V66 Q64 26 108 66 V94" fill="none" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- deck -->
  <rect x="16" y="90" width="96" height="9" rx="4.5" fill="#ffffff"/>
  <!-- piers -->
  <line x1="44" y1="47" x2="44" y2="90" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="84" y1="47" x2="84" y2="90" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
